services:
  - type: web
    name: alexanda-martinz-ai
    runtime: node
    plan: starter
    region: oregon
    env:
      NODE_ENV: production
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
    autoDeploy: true
